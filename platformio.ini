; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags = -fno-exceptions -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1 -D AG_LOG_LEVEL=AG_LOG_LEVEL_INFO -D ARDUINOJSON_ENABLE_PROGMEM=0 -D GIT_VERSION=\"3.7.0-homekit.2\"
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
	aglib=symlink://.
	EEPROM
	WebServer
	ESPmDNS
	FS
	SPIFFS
	HTTPClient
	WiFiClientSecure
	Update
	DNSServer
	h2zero/NimBLE-Arduino@2.3.7
	sensirion/Sensirion Core@0.7.3
	sensirion/Sensirion UART SPS30@1.0.0
	bblanchon/ArduinoJson@7.4.3

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
	aglib=symlink://.
	EEPROM
	ESP8266HTTPClient
	ESP8266WebServer
	DNSServer
;
monitor_filters = time

[platformio]
default_envs = one-homekit
src_dir = examples/OneOpenAir
; src_dir = examples/BASIC
; src_dir = examples/DiyProIndoorV4_2
; src_dir = examples/DiyProIndoorV3_3
; src_dir = examples/TestCO2
; src_dir = examples/TestPM
; src_dir = examples/TestSht

[env:one-homekit]
extends = env:esp32-c3
board_build.partitions = partitions-homekit.csv
extra_scripts = post:scripts/check_image_size.py
build_flags =
  ${env:esp32-c3.build_flags}
  -D AG_HOMEKIT=1
lib_deps =
  ${env:esp32-c3.lib_deps}
  https://github.com/HomeSpan/HomeSpan.git#1.9.1
